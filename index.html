<!DOCTYPE html>
<html lang="fr">
    <head>
        <meta charset="UTF-8">
        <link rel="manifest" href="./Manifest.webmanifest">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mot de Passe</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3" crossorigin="anonymous">
        <script type="text/javascript" src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
        <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p" crossorigin="anonymous"></script>
            
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,600,0,0" />
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css">
        <link rel="stylesheet" href="style.css">
    </head>
    <body onload="init()" class="password_2016">
        <div id="menu" class="page">
            <div class="centered">
                <button id="button_menu_start" role="button" class="btn password-button" onclick="initPassword()">Commencer</button>
                <button role="button" data-bs-toggle="modal" data-bs-target="#modal_settings" class="btn password-button">Paramètres</button>
            </div>
            <div id="rules">
                <h3>Les interdits</h3>
                <ul>
                    <li>Pas de mot composé</li>
                    <li>Pas de mot de même famille</li>
                    <li>Pas de mot commençant par le même son</li>
                    <li>Pas de mime</li>
                </ul>
            </div>
        </div>
        <div id="game" class="page centered">
            <button id="exit_button" role="button" onclick="quitPassword()"><</button>

            <div class="centered">
                <button id="button_password_start" role="button" class="btn password-button" onclick="startPassword()">Lancer</button>
                <button id="button_password_next" role="button" disabled class="d-none btn password-button" onclick="startPassword()">Mot suivant</button>
                <button id="button_password_restart" role="button" class="d-none btn password-button" onclick="initPassword()">Recommencer</button>
                <button id="button_password_quit" role="button" class="d-none btn password-button" onclick="quitPassword()">Quitter</button>
                <button id="button_password_settings" role="button" data-bs-toggle="modal" data-bs-target="#modal_settings" class="d-none btn password-button">Paramètres</button>
                <button id="button_password_recap" role="button" data-bs-toggle="modal" data-bs-target="#modal_recap" class="d-none btn password-button">Afficher le racapitulatif</button>
            </div>
            <div id="password_ingame_content" class="not-started">
                <div class="centered"> 
                    <div class="password_timer password-shield">
                        <div id="password_timer_global" class="d-none" role="progressbar" 
                        style="width: 100%">0:00</div>
                    </div>
                    <div id="password_ingame_status" class="password-shield"></div>
                    <span id="password_ingame_display" class="password-shield" onclick="alert(this.innerText)">...</span>
                </div>            
            </div>
            <div id="password_controls" class="bottom-0 d-flex flex-nowrap justify-content-center p-2 position-fixed w-100 not-started">
                <button id="button_password_invalidate" role="button" disabled class="btn password-button" onclick="passwordInvalidate()"><span class="material-symbols material-symbols-outlined">close</span></button>
                <button id="button_password_pass" role="button" disabled class="btn password-button" onclick="passwordPass()"><span class="material-symbols material-symbols-outlined">keyboard_return</span></button>
                <button id="button_password_validate" role="button" disabled class="btn password-button" onclick="passwordValidate()"><span class="material-symbols material-symbols-outlined">check</span></button>
            </div>
        </div>

        <div class="modal fade" id="modal_settings" tabindex="-1" role="dialog">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content p-3">
                    <div class="modal-header">
                        <h5 class="modal-title">Paramètres</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fermer"></button>
                    </div>
                    <div class="modal-body">
                        <!-- Nombre de mot -->
                        <div class="mb-3">
                            <h6>Mots</h6>          
                            <div class="mt-2">
                                <label for="slider_word_amount" class="form-label">Nombre de mot</label>
                                <div class="d-flex">
                                    <input type="range" class="form-range" id="slider_word_amount"
                                        min="1" max="10" value="5"
                                        oninput="
                                            document.getElementById('slider_word_amount_value').innerText = this.value;
                                            settings.word_amount = parseInt(this.value)
                                        ">
                                    <div class="ms-2 text-nowrap">
                                        <span id="slider_word_amount_value">5</span><span> mot(s)</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Chronomètre global -->
                        <div class="mb-3 d-none">
                            <h6>Chronomètre</h6>
                            <div class="form-check form-switch">
                                <input class="form-check-input" id="input_timer_global" type="checkbox"
                                    checked onclick="settings.use_timer_total = this.checked;" >
                                <label class="form-check-label" for="input_timer_global">Activer le chronomètre global</label>
                            </div>
                            <div class="mt-2">
                                <label for="slider_timer_total" class="form-label">Durée totale</label>
                                <div class="d-flex">
                                    <input type="range" class="form-range" id="slider_timer_total"
                                        min="30" max="120" value=""
                                        oninput="
                                            document.getElementById('slider_timer_total_value').innerText = this.value;
                                            settings.timer_total = parseInt(this.value)
                                        ">
                                    <div class="ms-2 text-nowrap">
                                        <span id="slider_timer_total_value"></span><span> secondes</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Temps par mot -->
                        <div class="mb-3 d-none">
                            <h6>Temps par mot</h6>
                            <div class="form-check form-switch">
                                <input class="form-check-input" id="input_timer_word" type="checkbox"
                                    onclick="game.settings.use_timer_word = this.checked" checked>
                                <label class="form-check-label" for="input_timer_word">Limiter le temps par mot</label>
                            </div>
                            <div class="mt-2">
                                <label for="slider_timer_word" class="form-label">Durée par mot</label>
                                <div class="d-flex">
                                    <input type="range" class="form-range" id="slider_timer_word"
                                        min="5" max="30" value=""
                                        oninput="
                                            document.getElementById('slider_timer_word_value').innerText = this.value;
                                            settings.timer_word = parseInt(this.value)
                                        ">
                                    <div class="ms-2 text-nowrap">
                                        <span id="slider_timer_word_value"></span><span> secondes</span>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-2">
                                <code>checkbox automatic passe after timed word</code>
                            </div>
                        </div>
                        <!-- Nombre de passes -->
                        <div class="mb-3 d-none">
                            <h6>Passes</h6>
                            <div class="mt-2">
                                <label for="slider_timer_word" class="form-label">Nombre maximum de mots passés</label>
                                <div class="d-flex">
                                    <input type="range" class="form-range" id="slider_max_passes"
                                        min="-1" max="10" value=""
                                        oninput="
                                            document.getElementById('slider_max_passes_value').innerText = this.value;
                                            settings.passes = parseInt(this.value)
                                        ">
                                    <div class="ms-2 text-nowrap">
                                        <span id="slider_max_passes_value"></span><span> passe(s) autorisé(s)</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <!-- Indices -->
                        <div class="mb-3 d-none">
                            <h6>Indices</h6>
                            <div class="form-check form-switch">
                                <input class="form-check-input" id="input_show_hints" type="checkbox"
                                    onclick="game.settings.show_hints = this.checked">
                                <label class="form-check-label" for="input_show_hints">Afficher des indices (lettres progressives)</label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal fade" id="modal_recap" tabindex="-1" role="dialog">
            <div class="modal-dialog modal-dialog-centered" role="document">
                <div class="modal-content p-2">
                    <div class="modal-header">
                        <h5 class="modal-title">Fin de partie</h5>
                        <button type="button" class="btn close" data-bs-dismiss="modal" aria-label="Close">
                            <span >&times;</span>
                        </button>
                    </div>
                    <div>
                        <div id="password_recap_placeholder"></div>
                    </div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
